version: 2
updates:
  # Keep the pinned GitHub Actions (checkout, setup-homebrew) current. The
  # formulae themselves are updated by update-formula.yml, not Dependabot.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"
